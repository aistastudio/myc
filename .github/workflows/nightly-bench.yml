name: nightly-bench

# Ночной прогон бенчмарков. ОТДЕЛЬНЫЙ от ci.yml намеренно — обоснование
# целиком в шапке scripts/bench-nightly.ts, коротко:
#   · абсолютные бюджеты требуют незагруженной машины, а в ci.yml бюджетные
#     тесты идут внутри общего `bun test` вместе с двумя тысячами других;
#   · прогон стоит минуты (стенды по 100k строятся заново в каждом файле) —
#     платить это на каждом коммите в PR не за что;
#   · семантика падения разная: красный PR блокирует слияние, красный ночной
#     прогон заводит разбор и никого не блокирует.
#
# Что остаётся в ci.yml: `bun test` (бюджетные тесты там проверяют
# ОТНОСИТЕЛЬНЫЕ утверждения — они от загрузки раннера не зависят) и
# `bun run bench:latency` (собственная методика: трейлы, медиана, порог
# регрессии 15 % к bench/baseline.json).

on:
  schedule:
    # 03:17 UTC — не ровный час: в ровные часы GitHub запускает разом слишком
    # много расписаний, и общий раннер достаётся более занятым.
    - cron: "17 3 * * *"
  workflow_dispatch:

# Два ночных прогона одновременно мерили бы друг друга.
concurrency:
  group: nightly-bench
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        run: bun install

      # Холодный старт (S63) мерится только на бинаре, собранном рецептом
      # сборки: scripts/bench-latency.ts пересобирает его сам, но пусть
      # провал сборки будет отдельным шагом, а не строкой внутри замера.
      - name: build
        run: bun run build

      # --force: на общем раннере GitHub (2 разделяемых ядра) проверка
      # готовности обычно не проходит. Тогда прогон снимает числа и проверяет
      # ОТНОСИТЕЛЬНЫЕ утверждения, а абсолютные бюджеты только печатает —
      # честнее, чем ронять ночь из-за соседа по гипервизору. Строгий режим
      # включится сам, когда машина пройдёт проверку (выделенный раннер).
      - name: nightly bench
        env:
          MYC_BENCH_LOG: bench-nightly.jsonl
        run: bun run scripts/bench-nightly.ts --force

      # Артефакт нужен и при падении: расхождение читают по числам с
      # условиями, а не по памяти.
      - name: замеры прогона
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-nightly-${{ github.run_id }}
          path: bench-nightly.jsonl
          if-no-files-found: warn
          retention-days: 90
