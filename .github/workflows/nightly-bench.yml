name: nightly-bench

# Ночной прогон бенчмарков. ОТДЕЛЬНЫЙ от ci.yml намеренно — обоснование
# целиком в шапке scripts/bench-nightly.ts, коротко:
#   · замер требует незагруженной машины, а в ci.yml бюджетные тесты идут
#     внутри общего `bun test` вместе с двумя тысячами других;
#   · прогон стоит минуты (стенды по 100k строятся заново в каждом файле) —
#     платить это на каждом коммите в PR не за что;
#   · семантика падения разная: красный PR блокирует слияние, красный ночной
#     прогон заводит разбор и никого не блокирует.
#
# Что остаётся в ci.yml: `bun test` (бюджетные тесты там проверяют
# ОТНОСИТЕЛЬНЫЕ утверждения — они от загрузки раннера не зависят) и
# `bun run bench:latency` (собственная методика: трейлы, медиана, порог
# регрессии 15 % к bench/baseline.json).

on:
  schedule:
    # 03:17 UTC — не ровный час: в ровные часы GitHub запускает разом слишком
    # много расписаний, и общий раннер достаётся более занятым.
    - cron: "17 3 * * *"
  workflow_dispatch:

# Два ночных прогона одновременно мерили бы друг друга.
concurrency:
  group: nightly-bench
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        run: bun install

      # Холодный старт (S63) мерится только на бинаре, собранном рецептом
      # сборки: scripts/bench-latency.ts пересобирает его сам, но пусть
      # провал сборки будет отдельным шагом, а не строкой внутри замера.
      - name: build
        run: bun run build

      # MYC_BENCH_ABSOLUTE=0 — этот раннер НЕ откалиброван под бюджеты И1, и
      # это объявление, а не догадка: бюджеты сняты на 14 ядрах arm64, общий
      # раннер GitHub — 4 ядра x86 (и модель процессора в пуле не закреплена).
      # Проверка готовности на нём ПРОХОДИТ (дрожание ×1.29–1.54 при пороге
      # 2.5), поэтому прежде ночь включала строгий режим и 2026-09-08…11
      # краснела четыре раза подряд на абсолютах: R3 федерация p50 17.4–22.0 мс
      # при бюджете p99 18, S59 ready p99 3.2 при 3, S44 гибрид p95 26 при 25 —
      # при том что относительные утверждения тех же замеров держались
      # (×1.93–1.97, ×4.17–4.28). Строгий режим теперь требует обоих «да»:
      # машина свободна (мерится) И откалибрована (эта переменная не стоит).
      #
      # Что ночь проверяет здесь: структурные и относительные утверждения
      # бюджетных тестов, каждый файл отдельным процессом (без двух тысяч
      # соседей по `bun test`); регрессию bench:latency к секции baseline
      # ЭТОЙ машины (bench/baseline.json, ключ linux-x64-4 — пока не снята);
      # сверки boost-eval и graph-eval. Абсолютные числа каждого замера
      # печатаются и пишутся в журнал с вердиктом — тренд виден по артефактам.
      # На выделенном откалиброванном раннере эту переменную надо убрать.
      #
      # --force: прогнать, даже если проверка готовности не прошла (сосед по
      # гипервизору) — абсолютов здесь всё равно нет, а относительные
      # утверждения загрузку переживают.
      - name: nightly bench
        env:
          MYC_BENCH_LOG: bench-nightly.jsonl
          MYC_BENCH_ABSOLUTE: "0"
        run: bun run scripts/bench-nightly.ts --force

      # Артефакт нужен и при падении: расхождение читают по числам с
      # условиями, а не по памяти.
      - name: замеры прогона
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-nightly-${{ github.run_id }}
          path: bench-nightly.jsonl
          if-no-files-found: warn
          retention-days: 90
