name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        run: bun install

      - name: typecheck
        run: bun run typecheck

      - name: test
        run: bun test

      - name: deps-check
        run: bun run deps-check

      - name: build
        run: bun run build

      # Бюджеты латентности (И1): prime p99<30мс, чтение<3мс, гибридный
      # поиск<25мс/100k, запись<5мс, холодный старт<60мс. Плюс регрессия
      # p95 > 15% относительно СВОЕЙ секции bench/baseline.json — линия
      # разложена по машинам, и если секции для этого раннера нет, скрипт
      # говорит об этом вслух и сравнения не делает: 15% от числа, снятого на
      # другом железе, не значат ничего.
      #
      # Абсолютные бюджеты здесь проверяются ТОЛЬКО при годных условиях
      # замера (дрожание эталона ниже порога — методика в packages/bench и в
      # docs/design/02-retrieval-and-performance.md §2.10). Общий раннер
      # GitHub на это право не имеет по построению, поэтому обязательная
      # часть проверки — относительные утверждения внутри `bun test` выше;
      # абсолюты добираются ночным прогоном (.github/workflows/nightly-bench.yml).
      - name: bench:latency (бюджеты И1 + регрессия к baseline)
        run: bun run bench:latency
